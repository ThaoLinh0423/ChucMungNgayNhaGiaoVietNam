<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4EC"/>
      <stop offset="100%" stop-color="#F8BBD0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFE082" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="500" height="500" fill="url(#bgGrad1)"/>
  <circle cx="250" cy="200" r="140" fill="url(#sunGlow)"/>

  <!-- Trái tim bay -->
  <g fill="#F48FB1" opacity="0.6">
    <path d="M70,90 A15,15 0 0,0 55,105 A15,15 0 0,0 70,120 L70,120 A15,15 0 0,0 85,105 A15,15 0 0,0 70,90 Z" transform="scale(1.2) translate(10, 10)"/>
    <path d="M380,80 A15,15 0 0,0 365,95 A15,15 0 0,0 380,110 L380,110 A15,15 0 0,0 395,95 A15,15 0 0,0 380,80 Z" transform="scale(1) translate(20, -10)"/>
  </g>

  <!-- Minh họa gia đình / Bố Mẹ thân thương -->
  <g transform="translate(140, 130)">
    <!-- Người bố bên trái -->
    <circle cx="70" cy="50" r="38" fill="#FCE4EC" stroke="#C2185B" stroke-width="3"/>
    <path d="M40,40 Q70,15 100,40 Q85,15 55,25 Z" fill="#6D4C41"/> <!-- Tóc bố -->
    <path d="M20,170 C20,110 120,110 120,170 Z" fill="#90CAF9"/> <!-- Áo bố -->
    <path d="M70,90 L70,135" stroke="#1565C0" stroke-width="4" stroke-linecap="round"/> <!-- Cà vạt -->

    <!-- Người mẹ bên phải -->
    <circle cx="150" cy="55" r="36" fill="#FCE4EC" stroke="#C2185B" stroke-width="3"/>
    <path d="M120,45 Q150,15 180,45 Q185,85 175,95 Q145,25 125,55 Z" fill="#5D4037"/> <!-- Tóc mẹ uốn -->
    <path d="M105,170 C105,115 195,115 195,170 Z" fill="#F48FB1"/> <!-- Áo mẹ -->
  </g>

  <!-- Bó hoa hồng lớn ở phía trước -->
  <g transform="translate(200, 310)">
    <circle cx="50" cy="20" r="30" fill="#FF4081" opacity="0.9"/>
    <circle cx="30" cy="0" r="25" fill="#F50057" opacity="0.85"/>
    <circle cx="70" cy="0" r="25" fill="#EC407A" opacity="0.85"/>
    <circle cx="50" cy="-20" r="28" fill="#FF80AB" opacity="0.95"/>
    <path d="M50,45 L35,110 M50,45 L50,115 M50,45 L65,110" stroke="#4CAF50" stroke-width="4" stroke-linecap="round"/>
    <path d="M20,60 Q50,40 80,60 Q50,80 20,60" fill="#E91E63"/> <!-- Nơ ruy băng -->
  </g>

  <!-- Chữ nghệ thuật -->
  <text x="250" y="440" font-family="'Quicksand', sans-serif" font-weight="700" font-size="24" fill="#880E4F" text-anchor="middle">
    Nụ Cười Rạng Rỡ Của Bố Mẹ 🌸
  </text>
  <text x="250" y="468" font-family="'Quicksand', sans-serif" font-size="16" fill="#AD1457" text-anchor="middle">
    (Chạm để phóng to xem ảnh)
  </text>
</svg>
