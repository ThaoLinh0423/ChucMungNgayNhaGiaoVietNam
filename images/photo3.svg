<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE4EC"/>
      <stop offset="100%" stop-color="#F8BBD0"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="url(#bgGrad3)"/>

  <!-- Biểu tượng cuốn sách mở & ngọn nến tri thức -->
  <g transform="translate(125, 150)">
    <!-- Bục giảng / Bàn sách gỗ nhẹ -->
    <rect x="-20" y="160" width="290" height="20" fill="#D7CCC8" rx="8"/>

    <!-- Cuốn sách mở lớn -->
    <path d="M20,140 Q65,110 125,125 Q185,110 230,140 L230,155 Q185,125 125,140 Q65,125 20,155 Z" fill="#FFFFFF" stroke="#EC407A" stroke-width="2"/>
    <path d="M20,140 L125,140 L230,140" stroke="#F48FB1" stroke-width="2"/>
    
    <!-- Các dòng chữ tượng trưng trong sách -->
    <line x1="45" y1="130" x2="105" y2="128" stroke="#F8BBD0" stroke-width="3" stroke-linecap="round"/>
    <line x1="45" y1="138" x2="95" y2="136" stroke="#F8BBD0" stroke-width="3" stroke-linecap="round"/>
    <line x1="145" y1="128" x2="205" y2="130" stroke="#F8BBD0" stroke-width="3" stroke-linecap="round"/>
    <line x1="155" y1="136" x2="205" y2="138" stroke="#F8BBD0" stroke-width="3" stroke-linecap="round"/>

    <!-- Cây bút mạ vàng -->
    <g transform="translate(180, 70) rotate(45)">
      <polygon points="10,0 15,10 5,10" fill="#FFA000"/>
      <rect x="5" y="10" width="10" height="50" fill="#E91E63" rx="2"/>
      <rect x="5" y="60" width="10" height="8" fill="#FFD54F"/>
    </g>

    <!-- Ngọn đèn hải đăng / Ngọn nến lung linh dẫn đường -->
    <g transform="translate(110, 20)">
      <rect x="8" y="45" width="14" height="40" fill="#FFF" stroke="#F48FB1" stroke-width="2" rx="4"/>
      <!-- Ngọn lửa ấm -->
      <path d="M15,15 Q25,32 15,45 Q5,32 15,15 Z" fill="#FFB300"/>
      <path d="M15,22 Q20,33 15,42 Q10,33 15,22 Z" fill="#FF5722"/>
      <circle cx="15" cy="30" r="28" fill="#FFF59D" opacity="0.35"/>
    </g>
  </g>

  <!-- Chữ thông điệp -->
  <text x="250" y="435" font-family="'Quicksand', sans-serif" font-weight="700" font-size="24" fill="#880E4F" text-anchor="middle">
    Người Thầy Dẫn Lối Tương Lai 🕊️
  </text>
  <text x="250" y="465" font-family="'Quicksand', sans-serif" font-size="16" fill="#AD1457" text-anchor="middle">
    Tri thức và nhân cách bố mẹ truyền dạy theo con suốt đời
  </text>
</svg>
